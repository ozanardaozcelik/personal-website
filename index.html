<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ozan Arda Özçelik | Drone Operator Mode</title>
    
    <style>
        /* GENEL SAYFA AYARLARI */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Koyu Lacivert Zemin */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; /* Izgara görünümü (Grid) */
            height: 100vh;
            overflow: hidden; /* Scroll yok */
            font-family: 'Segoe UI', sans-serif;
            user-select: none; /* Yazı seçmeyi engelle */
        }

        /* ----------------------------------------- */
        /* 1. UÇAN SAYAÇ PANELİ (Drone) */
        /* ----------------------------------------- */
        #flying-panel {
            position: absolute;
            top: 50%; /* Başlangıç konumu */
            left: 50%;
            transform: translate(-50%, -50%); /* Tam ortala */
            background: rgba(15, 23, 42, 0.95);
            padding: 20px 30px;
            border-radius: 12px;
            border: 2px solid #38bdf8; /* Mavi Çerçeve */
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
            text-align: center;
            width: 350px;
            z-index: 100;
            cursor: default;
        }

        /* Pervane Efekti (Süs) */
        #flying-panel::before, #flying-panel::after {
            content: '';
            position: absolute;
            top: -15px; left: 20px;
            width: 40px; height: 4px;
            background: #38bdf8;
            border-radius: 2px;
            animation: spin 0.1s linear infinite;
        }
        #flying-panel::after { left: auto; right: 20px; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .timer-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: white;
            margin-top: 10px;
        }
        .number {
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            color: #38bdf8;
            font-weight: bold;
        }
        .label { font-size: 0.7rem; color: #94a3b8; display: block; }
        .typewriter-text { color: #ccc; font-size: 0.8rem; border-bottom: 1px solid #333; padding-bottom: 10px; }


        /* ----------------------------------------- */
        /* 2. SİHA KUMANDASI (Alt Kısım) */
        /* ----------------------------------------- */
        #remote-controller {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 220px;
            background: #1e293b;
            border-top: 4px solid #334155;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            z-index: 200;
        }

        /* Kumanda Bilgisi */
        .brand-logo {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #64748b;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }

        /* Joystick Alanları */
        .stick-area {
            width: 140px;
            height: 140px;
            background: #0f172a;
            border-radius: 50%;
            border: 2px solid #334155;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Joystick Kolları (Topuzlar) */
        .stick-knob {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #475569, #1e293b);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s; /* Yumuşak hareket */
            border: 2px solid #38bdf8;
        }
        
        /* Stick Etiketleri */
        .stick-label {
            position: absolute;
            bottom: -30px;
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Sınır Çizgileri (Görsel) */
        .axis-line {
            position: absolute;
            background: #334155;
            z-index: 0;
        }
        .vertical-line { width: 2px; height: 100%; }
        .horizontal-line { width: 100%; height: 2px; }

    </style>
</head>
<body>

    <div id="flying-panel">
        <p class="typewriter-text">Merhaba ben Ozan, web kodlama öğrendiğimde akşam saat 6'da bu siteyi açacağım.<br>BEKLEMEDE KAL</p>
        <div class="timer-display">
            <div><span class="number">??</span><span class="label">GÜN</span></div>
            <span style="font-size: 1.5rem; margin-top:-15px;">:</span>
            <div><span id="cd-hours" class="number">00</span><span class="label">SAAT</span></div>
            <span style="font-size: 1.5rem; margin-top:-15px;">:</span>
            <div><span id="cd-minutes" class="number">00</span><span class="label">DAK</span></div>
            <span style="font-size: 1.5rem; margin-top:-15px;">:</span>
            <div><span id="cd-seconds" class="number">00</span><span class="label">SAN</span></div>
        </div>
    </div>

    <div id="remote-controller">
        <div class="brand-logo">OZAN REMOTE SYSTEM v1.0</div>

        <div class="stick-wrapper" style="position: relative; display: flex; justify-content: center;">
            <div class="stick-area" id="area-left">
                <div class="axis-line vertical-line"></div>
                <div class="stick-knob" id="stick-left"></div>
            </div>
            <div class="stick-label">İRTİFA (YUKARI/AŞAĞI)</div>
        </div>

        <div class="stick-wrapper" style="position: relative; display: flex; justify-content: center;">
            <div class="stick-area" id="area-right">
                <div class="axis-line horizontal-line"></div>
                <div class="stick-knob" id="stick-right"></div>
            </div>
            <div class="stick-label">YÖN (SAĞ/SOL)</div>
        </div>
    </div>

    <script>
        // --- 1. SAYAÇ MANTIĞI ---
        function updateCountdown() {
            const now = new Date();
            let target = new Date();
            target.setHours(18, 0, 0, 0);
            if (now > target) target.setDate(target.getDate() + 1);

            const diff = target - now;
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('cd-hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('cd-minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('cd-seconds').innerText = s < 10 ? '0' + s : s;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // --- 2. KUMANDA & UÇUŞ MANTIĞI ---
        
        // Elementler
        const panel = document.getElementById('flying-panel');
        const stickLeft = document.getElementById('stick-left');
        const areaLeft = document.getElementById('area-left');
        const stickRight = document.getElementById('stick-right');
        const areaRight = document.getElementById('area-right');

        // Değişkenler
        let velocityX = 0; // Yatay Hız
        let velocityY = 0; // Dikey Hız
        let posX = window.innerWidth / 2; // Başlangıç X
        let posY = window.innerHeight / 2 - 100; // Başlangıç Y
        
        // Joystick Durumları
        let leftActive = false;
        let rightActive = false;

        // --- SOL STICK (Dikey Kontrol) ---
        areaLeft.addEventListener('mousedown', startLeft);
        areaLeft.addEventListener('touchstart', startLeft);
        
        document.addEventListener('mousemove', moveLeft);
        document.addEventListener('touchmove', moveLeft);
        
        document.addEventListener('mouseup', endLeft);
        document.addEventListener('touchend', endLeft);

        function startLeft(e) { leftActive = true; }
        function endLeft() { 
            leftActive = false; 
            stickLeft.style.transform = `translate(0px, 0px)`; // Merkeze dön
            velocityY = 0; // Hızı sıfırla
        }
        function moveLeft(e) {
            if (!leftActive) return;
            e.preventDefault();
            
            // Mouse veya Touch koordinatını al
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Alanın merkezini bul
            let rect = areaLeft.getBoundingClientRect();
            let centerY = rect.top + rect.height / 2;
            
            // Farkı hesapla
            let deltaY = clientY - centerY;
            
            // Sınırla (Maksimum 40px hareket)
            if (deltaY > 40) deltaY = 40;
            if (deltaY < -40) deltaY = -40;

            // Stick'i görsel olarak hareket ettir
            stickLeft.style.transform = `translate(0px, ${deltaY}px)`;

            // Hızı ayarla (-5 ile +5 arası)
            velocityY = deltaY / 8; 
        }

        // --- SAĞ STICK (Yatay Kontrol) ---
        areaRight.addEventListener('mousedown', startRight);
        areaRight.addEventListener('touchstart', startRight);
        
        document.addEventListener('mousemove', moveRight);
        document.addEventListener('touchmove', moveRight);
        
        document.addEventListener('mouseup', endRight);
        document.addEventListener('touchend', endRight);

        function startRight(e) { rightActive = true; }
        function endRight() { 
            rightActive = false; 
            stickRight.style.transform = `translate(0px, 0px)`;
            velocityX = 0;
        }
        function moveRight(e) {
            if (!rightActive) return;
            e.preventDefault();

            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let rect = areaRight.getBoundingClientRect();
            let centerX = rect.left + rect.width / 2;
            
            let deltaX = clientX - centerX;
            
            if (deltaX > 40) deltaX = 40;
            if (deltaX < -40) deltaX = -40;

            stickRight.style.transform = `translate(${deltaX}px, 0px)`;
            
            velocityX = deltaX / 8;
        }

        // --- OYUN DÖNGÜSÜ (Game Loop) ---
        function updatePosition() {
            posX += velocityX;
            posY += velocityY;

            // Ekran sınırlarına çarpma kontrolü
            if (posX < 175) posX = 175; // Panel genişliğinin yarısı
            if (posX > window.innerWidth - 175) posX = window.innerWidth - 175;
            if (posY < 50) posY = 50;
            if (posY > window.innerHeight - 250) posY = window.innerHeight - 250; // Kumandaya çarpmasın

            // Panelin yeni konumunu uygula
            panel.style.left = posX + 'px';
            panel.style.top = posY + 'px';
            
            // Paneli hareket yönüne göre hafif eğ (Gerçekçilik için)
            let tiltX = velocityY * 2; // Aşağı giderken öne eğil
            let tiltY = velocityX * 2; // Sağa giderken yana yat
            panel.style.transform = `translate(-50%, -50%) perspective(500px) rotateX(${-tiltX}deg) rotateY(${tiltY}deg)`;

            requestAnimationFrame(updatePosition);
        }
        
        // Döngüyü başlat
        updatePosition();

        // Pencere boyutu değişirse paneli kaybetme
        window.addEventListener('resize', () => {
            posX = window.innerWidth / 2;
            posY = window.innerHeight / 2 - 100;
        });

    </script>
</body>
</html>
