<div id="top-countdown-panel">
        <p class="typewriter-text">Merhaba ben Ozan, web kodlama öğrendiğimde akşam saat 6'da bu siteyi açacağım.</p>
        <div class="timer-display">
            <div class="time-unit">
                <span class="number">??</span>
                <span class="label">GÜN</span>
            </div>
            <span class="separator">:</span>
            <div class="time-unit">
                <span id="cd-hours" class="number">00</span>
                <span class="label">SAAT</span>
            </div>
            <span class="separator">:</span>
            <div class="time-unit">
                <span id="cd-minutes" class="number">00</span>
                <span class="label">DAKİKA</span>
            </div>
            <span class="separator">:</span>
            <div class="time-unit">
                <span id="cd-seconds" class="number">00</span>
                <span class="label">SANİYE</span>
            </div>
        </div>
    </div>

    <style>
        /* Panel Tasarımı */
        #top-countdown-panel {
            position: fixed; /* Sayfa kaydırılsa bile tepede sabit kalsın */
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); /* Yarı saydam koyu lacivert */
            padding: 15px 30px;
            border-radius: 12px;
            border: 1px solid #38bdf8; /* Açık mavi çerçeve */
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            text-align: center;
            z-index: 9999; /* Her şeyin üstünde dursun */
            backdrop-filter: blur(5px);
            width: 80%;
            max-width: 600px;
        }

        /* Açıklama Yazısı */
        .typewriter-text {
            color: #94a3b8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            margin: 0 0 10px 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        /* Sayaç Kutusu */
        .timer-display {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            gap: 10px;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
            font-family: 'Courier New', monospace; /* Dijital saat hissi */
            min-width: 40px;
        }

        .separator {
            font-size: 1.5rem;
            color: #64748b;
            margin-top: -15px; /* Hizalama ayarı */
        }

        .label {
            font-size: 0.6rem;
            color: #64748b;
            letter-spacing: 1px;
        }
    </style>

    <script>
        // =========================================
        // GERİ SAYIM MANTIĞI (18:00 HEDEFLİ)
        // =========================================
        function updateCountdown() {
            const now = new Date();
            let target = new Date();

            // Hedef saati 18:00:00 olarak ayarla
            target.setHours(18, 0, 0, 0);

            // Eğer şu an saat 18:00'i geçtiyse, hedef yarın akşam 18:00 olsun
            if (now > target) {
                target.setDate(target.getDate() + 1);
            }

            const diff = target - now;

            // Matematiksel hesaplamalar
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            // Ekrana yazdırma (Tek haneli ise başına 0 ekle)
            document.getElementById('cd-hours').innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById('cd-minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('cd-seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
            
            // GÜN kısmı HTML'de zaten statik olarak "??" yazıldı, ona dokunmuyoruz.
        }

        // Sayacı her 1 saniyede bir güncelle
        setInterval(updateCountdown, 1000);
        updateCountdown(); // Sayfa açılır açılmaz bir kere çalıştır (bekleme yapmasın)
    </script>
